[project]
name = "braintumor-majorproject"
version = "0.1.0"
description = "BrainTumor-MajorProject v2.3 — modular MRI analysis (research prototype, not clinical)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "pydantic>=2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.33",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "pandas>=2",
  "pytest>=8",
  "filetype>=1.2",        # MIME sniffing (app/api MIME-spoofing defense)
  "prometheus-client>=0.26",  # /metrics exposition (app/api/main.py)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q"

[tool.coverage.run]
source = ["brain_tumor"]
omit = ["*/tests/*", "*/scripts/train/*"]

[tool.coverage.report]
fail_under = 70

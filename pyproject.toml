[project]
name = "braintumor-majorproject"
version = "0.1.0"
description = "BrainTumor-MajorProject v2.3 — modular MRI analysis (research prototype, not clinical)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "pydantic>=2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.33",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "pandas>=2",
  "filetype>=1.2",        # MIME sniffing (app/api MIME-spoofing defense)
  "prometheus-client>=0.26",  # /metrics exposition (app/api/main.py)
  "python-multipart>=0.0.3",  # multipart/form-data parsing for UploadFile endpoints
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pyright>=1.1",
  "hypothesis>=6.100",
  "pip-audit>=2.7",
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q"

[tool.coverage.run]
source = ["brain_tumor"]
omit = ["*/tests/*", "*/scripts/train/*"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "checkpoints", "data", "demo_data", "outputs", ".pytest_cache", ".benchmarks", ".freebuff", "__pycache__"]
src = ["src", "app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# tests: bare `assert`/prints by design; blind raises + dict() constructors
# + late imports + if/else blocks are deliberate test idioms here.
"tests/**/*.py" = ["T20", "B017", "C408", "E402", "SIM108"]
# CLI-facing entry points: ImportError fallbacks / progress output.
"app/streamlit/app.py" = ["T20"]
"src/brain_tumor/classification/calibrate.py" = ["T20"]

[tool.pyright]
# Align analysis with the COMMITTED tree: the local-only modules below are
# gitignored (never present in CI), so excluding them keeps a developer's
# local pyright run comparable to the CI run.
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "src/brain_tumor/models",
  "src/brain_tumor/data/locked_holdout.py",
  "tests/test_locked_holdout.py",
  "tests/unit/test_contracts_property.py",
  "tests/unit/test_train_candidate_tracking.py",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
pythonVersion = "3.11"
typeCheckingMode = "basic"
